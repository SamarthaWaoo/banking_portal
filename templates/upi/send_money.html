{% extends "base.html" %}
{% block title %}Send Money — SpendSmart Bank{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="vb-card mx-auto p-4 p-lg-5" style="max-width: 560px;">
    <h4 class="vb-section-title mb-1"><i class="bi bi-send"></i> Send Money</h4>
    <p class="text-muted small mb-4">Instant transfer to any SpendSmart Bank UPI ID.</p>

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label>From Account</label>
        <select name="sender_account" class="form-select" required>
          {% for acc in accounts %}
          <option value="{{ acc.id }}">{{ acc.get_account_type_display }} — {{ acc.account_number }} (₹{{ acc.balance }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label>Receiver UPI ID</label>
        <input type="text" name="receiver_upi_id" class="form-control" placeholder="name123SpendSmartbank" required>
      </div>
      <div class="mb-3">
        <label>Amount (₹)</label>
        <input type="number" step="0.01" min="1" name="amount" class="form-control" placeholder="e.g. 500" required>
      </div>
      <div class="mb-3">
        <label>Note (optional)</label>
        <input type="text" name="note" class="form-control" placeholder="e.g. Rent, Dinner split">
      </div>
      <div class="mb-4">
        <label>Transaction PIN</label>
        <input type="password" name="pin" inputmode="numeric" maxlength="4" class="form-control" placeholder="4-digit PIN" required>
      </div>
      <button type="submit" class="btn vb-btn-primary w-100 py-2">
        <i class="bi bi-lock-fill"></i> Confirm &amp; Send
      </button>
    </form>
  </div>
</div>
{% endblock %}
